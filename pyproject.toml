[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinostate"
version = "0.1.0"
description = "Kinostate — a decoupled, memory-native AI video agent (brand memory as a portable asset, model-agnostic generation)."
requires-python = ">=3.10"
dependencies = [
    "sibyl-memory-client>=0.8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
